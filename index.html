<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ลงทะเบียนนักศึกษา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>ลงทะเบียนนักศึกษา</h1>
  <p class="sub">กรอกข้อมูลให้ครบทุกช่องที่มีเครื่องหมาย *</p>

  <form id="form" class="card" novalidate>
    <div class="grid">
      <div><label for="first_name">ชื่อ *</label><input id="first_name" name="first_name" required autocomplete="given-name"></div>
      <div><label for="last_name">นามสกุล *</label><input id="last_name" name="last_name" required autocomplete="family-name"></div>
      <div><label for="age">อายุ *</label><input id="age" name="age" type="number" min="5" max="120" inputmode="numeric" required></div>
      <div><label for="student_id">เลขนักศึกษา *</label><input id="student_id" name="student_id" required inputmode="numeric"></div>
      <div><label for="department">แผนก *</label><input id="department" name="department" required></div>
      <div><label for="branch">สาขา *</label><input id="branch" name="branch" required></div>
      <div class="full">
        <label for="level">ระดับชั้น *</label>
        <select id="level" name="level" required>
          <option value="">-- เลือกระดับชั้น --</option>
          <option>ปวช.1</option><option>ปวช.2</option><option>ปวช.3</option>
          <option>ปวส.1</option><option>ปวส.2</option>
          <option>ปริญญาตรี ปี 1</option><option>ปริญญาตรี ปี 2</option>
          <option>ปริญญาตรี ปี 3</option><option>ปริญญาตรี ปี 4</option>
          <option>อื่น ๆ</option>
        </select>
      </div>
      <div class="full"><label for="motto">คติประจำใจ</label><textarea id="motto" name="motto" maxlength="300"></textarea></div>
      <div class="full"><button id="submit" type="submit">ลงทะเบียน</button></div>
    </div>
    <div id="msg" class="msg" role="status" aria-live="polite"></div>
  </form>

  <p class="foot"><a href="admin.html">สำหรับผู้ดูแลระบบ</a></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.APP_CONFIG;
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const btn = document.getElementById('submit');

function show(type, text){ msg.className = 'msg ' + type; msg.textContent = text; }

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!form.checkValidity()) { form.reportValidity(); return; }
  const f = new FormData(form);
  const row = {
    first_name: f.get('first_name').trim(),
    last_name: f.get('last_name').trim(),
    age: parseInt(f.get('age'), 10),
    department: f.get('department').trim(),
    branch: f.get('branch').trim(),
    student_id: f.get('student_id').trim(),
    level: f.get('level'),
    motto: f.get('motto').trim() || null,
  };
  btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
  const { error } = await db.from('registrations').insert(row);
  btn.disabled = false; btn.textContent = 'ลงทะเบียน';
  if (error) {
    show('err', error.code === '23505'
      ? 'เลขนักศึกษานี้ลงทะเบียนไปแล้ว'
      : 'บันทึกไม่สำเร็จ: ' + error.message);
    return;
  }
  form.reset();
  show('ok', 'ลงทะเบียนสำเร็จ');
});
</script>
</body>
</html>
